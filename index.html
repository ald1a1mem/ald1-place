        <div class="flex items-baseline gap-2">
          <span class="font-bold text-lg tracking-tight text-ink">ALD1 朝聖地</span>
          <span class="hidden sm:inline-block text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 font-medium">非即時更新</span>

          rel="noopener noreferrer"

        >
          <i class="fa-brands fa-x-twitter"></i>
          <span class="hidden sm:inline">@ald1_place</span>
        </a>
      </div>
    </div>
  </header>

  <!-- 主視覺標題區 -->
  <section id="top" class="max-w-6xl mx-auto w-full px-4 sm:px-6 pt-8 pb-6">
    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-soft border border-stone-200/70 relative overflow-hidden">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6 relative z-10">
        <div class="space-y-2.5 max-w-2xl">

            ALD1 朝聖地
          </h1>
          <p class="text-muted text-sm sm:text-base leading-relaxed">
            此網站為記錄成員們去過的地方 · 非即時更新
            <span class="hidden sm:inline text-stone-300 mx-1">|</span>
            <span class="block sm:inline text-amber-800 font-medium mt-1 sm:mt-0">
              點擊卡片愛心印章即可記錄你的個人踩點進度 ✨
            </span>
          </p>
        </div>

        <!-- 統計與朝聖進度卡 -->
        <div class="bg-paper rounded-2xl p-4 sm:p-5 border border-stone-200/80 min-w-full sm:min-w-[310px] lg:w-[340px] space-y-3">

            <div class="bg-white rounded-xl py-2 px-2 border border-stone-200/60">
              <div id="statTotal" class="text-xl font-extrabold text-ink">11</div>
              <div class="text-[11px] text-muted font-medium">總計地點</div>
            </div>
            <div class="bg-white rounded-xl py-2 px-2 border border-stone-200/60">
              <div id="statFilming" class="text-xl font-extrabold text-indigo-600">4</div>
              <div class="text-[11px] text-muted font-medium">拍攝地</div>
            </div>
            <div class="bg-white rounded-xl py-2 px-2 border border-stone-200/60">
              <div id="statFood" class="text-xl font-extrabold text-amber-600">7</div>
              <div class="text-[11px] text-muted font-medium">餐廳美食</div>
            </div>
          </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 搜尋與篩選控制列 -->

        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>

            id="searchInput"
            type="text"
            oninput="handleSearch(this.value)"
            placeholder="搜尋店名、韓文、聖水、弘大、海帶湯、牛骨湯、EP.19..."

            id="clearSearchBtn"
            onclick="clearSearch()"
            class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-ink p-1 cursor-pointer"
            title="清除搜尋"
          >

          </button>
        </div>

        icon: "fa-house-chimney-window",
        gradient: "from-cyan-500/20 via-sky-300/15 to-teal-200/25",
        accentColor: "text-cyan-900",
        badgeBg: "bg-cyan-100/90 text-cyan-900 border-cyan-200",
        naverUrl: "https://map.naver.com/p/search/울산%20동구%20주전해안길%20212",
        googleUrl: "https://www.google.com/maps/search/?api=1&query=울산+동구+주전해안길+212"
      },
      {
        id: 9,
        image: "9.jpg",
        zhName: "旺山海水浴場",
        koName: "왕산해수욕장",
        category: "拍攝地",
        region: "仁川 · 中區乙旺洞",
        members: [],
        source: "ONE DREAM FOREVER EP.23",
        zhAddress: "仁川廣域市 中區 乙旺洞 旺山海水浴場",
        koAddress: "인천 중구 을왕동 왕산해수욕장",
        note: "",
        icon: "fa-umbrella-beach",
        gradient: "from-blue-500/20 via-cyan-300/15 to-amber-100/30",
        accentColor: "text-blue-900",
        badgeBg: "bg-blue-100/90 text-blue-900 border-blue-200",
        naverUrl: "https://map.naver.com/p/search/인천%20중구%20을왕동%20왕산해수욕장",
        googleUrl: "https://www.google.com/maps/search/?api=1&query=인천+중구+을왕동+왕산해수욕장"
      },
      {
        id: 10,
        image: "10.jpg",
        zhName: "Jayden 29 民宿",
        koName: "제이든29펜션",
        category: "拍攝地",
        region: "仁川 · 中區龍游",
        members: [],
        source: "ONE DREAM FOREVER EP.24",
        zhAddress: "仁川廣域市 中區 龍游西路302번길 18 Jayden 29 民宿",
        koAddress: "인천 중구 용유서로302번길 18 제이든29 펜션",
        note: "",
        icon: "fa-water",
        gradient: "from-indigo-500/20 via-purple-300/15 to-pink-200/20",
        accentColor: "text-indigo-900",
        badgeBg: "bg-indigo-100/90 text-indigo-900 border-indigo-200",
        naverUrl: "https://map.naver.com/p/search/인천%20중구%20용유서로302번길%2018",
        googleUrl: "https://www.google.com/maps/search/?api=1&query=인천+중구+용유서로302번길+18"
      },
      {
        id: 11,
        image: "11.jpg",
        zhName: "Nabeya / 鍋屋",
        koName: "나베야",
        category: "餐廳",
        region: "連鎖店",
        members: ["LEO"],
        source: "260910 LEO PC",
        zhAddress: "無詳細地址資訊",
        koAddress: "",
        note: "連鎖店",
        icon: "fa-fire-burner",
        gradient: "from-red-500/20 via-orange-300/15 to-amber-200/25",
        accentColor: "text-red-900",
        badgeBg: "bg-red-100/90 text-red-900 border-red-200",
        naverUrl: "https://map.naver.com/p/search/나베야",
        googleUrl: "https://www.google.com/maps/search/?api=1&query=나베야"
      }
    ];

    const STORAGE_KEY = "ald1_place_visited_ids_v1";
    let visitedIds = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

    let state = {
      search: "",
      category: "全部",
      tag: "全部",
      visitedOnly: false
    };

    function getPlaceImageSrc(place) {
      if (place.image && place.image.trim() !== "") return place.image.trim();
      return `./${place.id}.png`;
    }

    function saveVisited() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...visitedIds]));
      updateStatsAndProgress();
    }

    function toggleVisited(id, event) {
      if (event) event.stopPropagation();
      if (visitedIds.has(id)) {
        visitedIds.delete(id);
        showToast("已取消踩點標記");
      } else {
        visitedIds.add(id);
        showToast("已加入「我的朝聖進度」！");
      }
      saveVisited();
      renderPlaces();
    }

    function toggleVisitedOnly() {
      state.visitedOnly = !state.visitedOnly;
      const btn = document.getElementById("visitedToggleBtn");
      if (state.visitedOnly) {
        btn.className = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold border transition-all cursor-pointer bg-rose-500 text-white border-rose-500 shadow-sm";
        btn.querySelector(".fa-heart").className = "fa-solid fa-heart text-white";
        btn.querySelector("#visitedBadgeCount").className = "px-1.5 py-0.2 rounded-full bg-white/25 text-white text-xs font-bold";
      } else {
        btn.className = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold border transition-all cursor-pointer bg-white text-ink border-stone-200 hover:border-rose-300 hover:bg-rose-50/60";
        btn.querySelector(".fa-heart").className = "fa-solid fa-heart text-rose-500";
        btn.querySelector("#visitedBadgeCount").className = "px-1.5 py-0.2 rounded-full bg-rose-100 text-rose-700 text-xs font-bold";
      }
      renderPlaces();
    }

    function setCategory(cat) {
      state.category = cat;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        const isActive = btn.dataset.cat === cat;
        btn.className = isActive
          ? "cat-btn active shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition-all cursor-pointer bg-ink text-white shadow-sm"
          : "cat-btn shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition-all cursor-pointer bg-paper text-muted hover:text-ink hover:bg-stone-200/70";
      });
      renderPlaces();
    }

    function setTag(tag) {
      state.tag = tag;
      renderTagFilters();
      renderPlaces();
    }

    function handleSearch(val) {
      state.search = val.trim();
      document.getElementById("clearSearchBtn").classList.toggle("hidden", !state.search);
      renderPlaces();
    }

    function clearSearch() {
      const input = document.getElementById("searchInput");
      input.value = "";
      handleSearch("");
      input.focus();
    }

    function resetAllFilters() {
      state = { search: "", category: "全部", tag: "全部", visitedOnly: false };
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");

      const btn = document.getElementById("visitedToggleBtn");
      btn.className = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold border transition-all cursor-pointer bg-white text-ink border-stone-200 hover:border-rose-300 hover:bg-rose-50/60";
      btn.querySelector(".fa-heart").className = "fa-solid fa-heart text-rose-500";
      btn.querySelector("#visitedBadgeCount").className = "px-1.5 py-0.2 rounded-full bg-rose-100 text-rose-700 text-xs font-bold";

      setCategory("全部");
      renderTagFilters();
      renderPlaces();
    }

    function getTagCount(tag) {
      if (tag === "全部") return PLACES_DATA.length;
      return PLACES_DATA.filter(p => Array.isArray(p.members) && p.members.includes(tag)).length;
    }

    function renderTagFilters() {
      const container = document.getElementById("memberFilters");
      container.innerHTML = FILTER_TAGS.map(tag => {
        const count = getTagCount(tag);
        const active = state.tag === tag;
        return `
          <button
            onclick="setTag('${tag}')"
            class="px-3 py-1 rounded-full text-xs font-semibold transition-all cursor-pointer border ${
              active
                ? "bg-amber-400 text-ink border-amber-500 shadow-xs"
                : "bg-paper text-muted border-stone-200/80 hover:border-amber-300 hover:text-ink"
            }"
          >
            ${tag} <span class="opacity-70">(${count})</span>
          </button>
        `;
      }).join("");
    }

    function updateStatsAndProgress() {
      const total = PLACES_DATA.length;
      const filming = PLACES_DATA.filter(p => p.category === "拍攝地").length;
      const food = PLACES_DATA.filter(p => p.category === "餐廳").length;
      const visitedCount = PLACES_DATA.filter(p => visitedIds.has(p.id)).length;
      const pct = total > 0 ? Math.round((visitedCount / total) * 100) : 0;

      document.getElementById("statTotal").textContent = total;
      document.getElementById("statFilming").textContent = filming;
      document.getElementById("statFood").textContent = food;
      document.getElementById("countAll").textContent = total;
      document.getElementById("countFilming").textContent = filming;
      document.getElementById("countFood").textContent = food;

      document.getElementById("visitedBadgeCount").textContent = visitedCount;
      document.getElementById("progressText").textContent = `${visitedCount} / ${total} (${pct}%)`;
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function copyText(text, label = "已複製") {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast(`${label}：${text}`);
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(`${label}：${text}`);
      });
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").textContent = msg;
      toast.classList.remove("opacity-0", "translate-y-3");
      toast.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-3");
      }, 2200);
    }

    function openLightbox(src, title, sub) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightboxTitle").textContent = title;
      document.getElementById("lightboxSub").textContent = sub;
      document.getElementById("lightboxModal").classList.remove("hidden");
    }

    function closeLightbox() {
      document.getElementById("lightboxModal").classList.add("hidden");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });

    function getFilteredPlaces() {
      return PLACES_DATA.filter(place => {
        if (state.category !== "全部" && place.category !== state.category) return false;
        if (state.tag !== "全部") {
          if (!Array.isArray(place.members) || !place.members.includes(state.tag)) return false;
        }
        if (state.visitedOnly && !visitedIds.has(place.id)) return false;

        if (state.search) {
          const q = state.search.toLowerCase();
          const haystack = [
            place.zhName,
            place.koName,
            place.region,
            place.source,
            place.zhAddress,
            place.koAddress,
            place.note,
            ...(place.members || [])
          ].join(" ").toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });
    }

    function renderPlaces() {
      const filtered = getFilteredPlaces();
      const grid = document.getElementById("placesGrid");
      const empty = document.getElementById("emptyState");
      const summary = document.getElementById("resultSummary");
      const resetBtn = document.getElementById("resetFiltersBtn");

      const hasActiveFilter = state.search || state.category !== "全部" || state.tag !== "全部" || state.visitedOnly;
      resetBtn.classList.toggle("hidden", !hasActiveFilter);

      const parts = [];
      if (state.visitedOnly) parts.push("已踩點");
      if (state.category !== "全部") parts.push(state.category);
      if (state.tag !== "全部") parts.push(state.tag);
      if (state.search) parts.push(`「${state.search}」`);
      summary.textContent = parts.length
        ? `篩選結果：共 ${filtered.length} 個地點（${parts.join(" · ")}）`
        : `顯示全部 ${filtered.length} 個朝聖地點`;

      if (filtered.length === 0) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }

      empty.classList.add("hidden");

      grid.innerHTML = filtered.map(place => {
        const isVisited = visitedIds.has(place.id);
        const isFilming = place.category === "拍攝地";
        const hasAddress = place.koAddress && place.koAddress.trim() !== "";
        const imgSrc = getPlaceImageSrc(place);

        const categoryBadge = isFilming
          ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200/80"><i class="fa-solid fa-clapperboard text-[10px]"></i>拍攝地</span>`
          : `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-50 text-amber-800 border border-amber-200/80"><i class="fa-solid fa-utensils text-[10px]"></i>餐廳</span>`;

        const noteHtml = place.note
          ? `<div class="mt-3 px-3 py-2 rounded-xl bg-amber-50/80 border border-amber-200/70 text-xs text-amber-950 flex items-start gap-2">
               <i class="fa-regular fa-note-sticky text-amber-600 mt-0.5 shrink-0"></i>
               <span class="font-medium">${place.note}</span>
             </div>`
          : "";

        const mapsHtml = hasAddress
          ? `<div class="grid grid-cols-2 gap-2 pt-3 border-t border-stone-100">
               <a href="${place.naverUrl}" target="_blank" rel="noopener noreferrer"
                  class="flex items-center justify-center gap-1.5 py-2 px-3 rounded-xl text-xs font-bold bg-[#03C75A]/10 text-[#029e47] hover:bg-[#03C75A] hover:text-white border border-[#03C75A]/25 transition-all">
                 <i class="fa-solid fa-location-dot"></i>
                 <span>Naver 地圖</span>
               </a>
               <a href="${place.googleUrl}" target="_blank" rel="noopener noreferrer"
                  class="flex items-center justify-center gap-1.5 py-2 px-3 rounded-xl text-xs font-bold bg-[#4285F4]/10 text-[#2563eb] hover:bg-[#4285F4] hover:text-white border border-[#4285F4]/25 transition-all">
                 <i class="fa-solid fa-map"></i>
                 <span>Google 地圖</span>
               </a>
             </div>`
          : `<div class="pt-3 border-t border-stone-100 flex items-center justify-between text-xs text-stone-400">
               <span><i class="fa-regular fa-compass mr-1"></i>暫無詳細座標連結</span>
               ${place.naverUrl ? `<a href="${place.naverUrl}" target="_blank" rel="noopener noreferrer" class="text-stone-600 hover:text-ink underline">搜尋名稱</a>` : ""}
             </div>`;

        return `
          <article class="group bg-white rounded-3xl overflow-hidden border ${isVisited ? "border-rose-300 ring-2 ring-rose-500/15" : "border-stone-200/80"} shadow-card hover:shadow-cardHover transition-all duration-300 flex flex-col">
            <!-- 卡片頂部預覽圖（若無圖片檔則自動顯示漸層＋圖示） -->
            <div class="relative h-40 overflow-hidden bg-paper">
              <img
                src="${imgSrc}"
                alt="${place.zhName}"
                loading="lazy"
                onclick="openLightbox('${imgSrc}', '${place.zhName.replace(/'/g, "\\'")}', '${place.koName.replace(/'/g, "\\'")} · ${place.source.replace(/'/g, "\\'")}')"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                class="w-full h-full object-cover cursor-zoom-in transition-transform duration-500 group-hover:scale-105"
              />
              <div style="display:none" class="w-full h-full bg-gradient-to-br ${place.gradient} items-center justify-center">
                <i class="fa-solid ${place.icon} text-3xl ${place.accentColor} opacity-45 group-hover:scale-110 transition-transform duration-300"></i>
              </div>
              <div class="absolute inset-0 bg-gradient-to-t from-black/45 via-transparent to-black/15 pointer-events-none"></div>

              <div class="absolute top-3 left-3 z-10 pointer-events-none">
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold border backdrop-blur-xs ${place.badgeBg}">
                  <i class="fa-solid fa-location-pin text-[10px]"></i>
                  ${place.region}
                </span>
              </div>

              <button
                onclick="toggleVisited(${place.id}, event)"
                aria-label="標記已踩點"
                title="${isVisited ? "取消已踩點" : "標記為已踩點"}"
                class="absolute top-3 right-3 z-10 w-9 h-9 rounded-full flex items-center justify-center transition-all cursor-pointer shadow-sm ${
                  isVisited
                    ? "bg-rose-500 text-white animate-pop"
                    : "bg-white/90 text-stone-400 hover:text-rose-500 hover:bg-white"
                }"
              >
                <i class="fa-solid fa-heart text-sm"></i>
              </button>
            </div>

            <!-- 卡片內容區 -->
            <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
              <div class="space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <div class="flex items-center gap-2 flex-wrap mb-1">
                      ${categoryBadge}
                      ${isVisited ? `<span class="text-[11px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-200">✓ 已踩點</span>` : ""}
                    </div>
                    <h2 class="text-lg font-bold text-ink leading-snug group-hover:text-amber-900 transition-colors">
                      ${place.zhName}
                    </h2>
                    <p class="font-kr text-xs text-muted font-medium mt-0.5">
                      ${place.koName}
                    </p>
                  </div>
                </div>

                <div class="flex items-center gap-1.5 text-xs text-muted bg-paper px-3 py-2 rounded-xl border border-stone-200/60">
                  <i class="fa-solid fa-film text-amber-600 shrink-0"></i>
                  <span class="font-semibold text-stone-500 shrink-0">出處：</span>
                  <span class="text-ink font-medium truncate" title="${place.source}">${place.source}</span>
                </div>

                <div class="space-y-1.5 text-xs">
                  <div class="flex items-start justify-between gap-2">
                    <div class="text-ink leading-relaxed">
                      <span class="font-semibold text-stone-500 mr-1">地址：</span>
                      <span class="${hasAddress ? "text-ink" : "text-stone-400 italic"}">${place.zhAddress}</span>
                    </div>
                  </div>
                  ${hasAddress ? `
                    <div class="flex items-center justify-between gap-2 bg-stone-50 px-2.5 py-1.5 rounded-lg border border-stone-200/70">
                      <span class="font-kr text-[11px] text-stone-600 truncate" title="${place.koAddress}">${place.koAddress}</span>
                      <button
                        onclick="copyText('${place.koAddress.replace(/'/g, "\\'")}', '已複製韓文地址')"
                        class="shrink-0 inline-flex items-center gap-1 text-[11px] font-semibold text-amber-800 hover:text-amber-950 bg-amber-100/80 hover:bg-amber-200/80 px-2 py-0.5 rounded-md transition-colors cursor-pointer"
                        title="複製韓文地址"
                      >
                        <i class="fa-regular fa-copy"></i>
                        <span>複製</span>
                      </button>
                    </div>
                  ` : ""}
                </div>

                ${noteHtml}
              </div>

              ${mapsHtml}
            </div>
          </article>
        `;
      }).join("");
    }

    renderTagFilters();
    updateStatsAndProgress();
    renderPlaces();
  </script>
</body>
</html>
